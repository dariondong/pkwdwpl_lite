# PKWDWPL Lite 的 Gradle 参数
#
# 堆内存调小一点：GitHub Actions 的 ubuntu-latest 只有 4 核 / 16GB，
# 模板默认的 -Xmx8G + MaxMetaspace 4G 在 CI 上很容易 OOM。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Flutter 模板新增的开关（保持默认值即可）
android.newDsl=false
android.builtInKotlin=false
