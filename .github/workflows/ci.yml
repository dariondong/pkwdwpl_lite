name: CI Test Build

# 日常开发用：推 main / 提 PR 时跑「静态检查 + 单元测试 + Debug 包编译」，
# 全绿之后再打 tag（tag 会触发 release.yml 出正式包）。
on:
  push:
    branches: [main, 'dev/**', 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地一致的 stable 版本；要升级时改这里即可（记得同步 test/CI 通过）
  FLUTTER_VERSION: '3.47.3'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Check version consistency
        run: python3 tool/sync_version.py

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  android-debug:
    name: Android Debug APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-debug-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'third_party/**/*.gradle') }}
          restore-keys: |
            gradle-debug-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --debug
        run: flutter build apk --debug

      # 构建失败时的诊断（只做「配置阶段」，不重新编译，几十秒出结果）：
      #   1) 把关键文件打出来 —— Flutter 工具链会在构建前自动迁移（改写）
      #      android/app/build.gradle.kts，排错必须看到迁移之后的内容
      #   2) 用 --stacktrace 复现配置阶段报错，直接拿到抛异常的调用栈
      - name: Diagnose Gradle configuration failure
        if: failure()
        run: |
          echo "========== android/app/build.gradle.kts (after Flutter migration) =========="
          cat -n android/app/build.gradle.kts || true
          echo "========== android/build.gradle.kts =========="
          cat -n android/build.gradle.kts || true
          echo "========== android/gradle.properties =========="
          cat -n android/gradle.properties || true
          echo "========== android/settings.gradle.kts =========="
          cat -n android/settings.gradle.kts || true
          echo "========== 插件列表 (.flutter-plugins-dependencies) =========="
          cat .flutter-plugins-dependencies || true
          echo "========== 第三方插件结构 =========="
          find third_party -maxdepth 3 -name "*.gradle*" -o -maxdepth 3 -name "AndroidManifest.xml" | sort || true

      - name: Reproduce configuration error with stacktrace
        if: failure()
        working-directory: android
        run: |
          echo "===== ./gradlew :app:help --stacktrace （仅配置阶段）====="
          ./gradlew :app:help --stacktrace --no-daemon --console=plain 2>&1 | tail -160 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pkwdwpl-lite-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
