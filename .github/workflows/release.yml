name: Build Release APK

# 打 tag 才发版（例如 v1.0.0）。请务必等 CI Test Build 全绿之后再打 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'third_party/**/*.gradle') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Check version consistency
        run: python3 tool/sync_version.py

      - name: Run tests before release
        run: |
          flutter analyze
          flutter test

      # ---------------------------------------------------------------------
      # 签名：从 Secrets 恢复 keystore 并生成 android/key.properties
      # （与 APRSLocus 的打包方式保持一致，两边的操作习惯通用）
      #
      # 需要的 Secrets：
      #   ANDROID_KEYSTORE_BASE64    keystore 的 base64（见 tool/gen_keystore.py）
      #   ANDROID_KEYSTORE_PASSWORD  keystore 密码
      #   ANDROID_KEY_ALIAS          可选，默认 pkwdwpl
      #
      # 这里刻意做成「缺 Secret 直接失败」而不是静默回退 debug 签名：
      # tag 会直接产出面向用户的正式包，宁可不发，也不要发一个 debug 签名的包
      # （debug 签名的包用户无法覆盖安装后续正式版）。
      # ---------------------------------------------------------------------
      - name: Restore keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'pkwdwpl' }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64。请先按 README「签名配置」章节配置签名。"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_PASSWORD。"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/release.keystore\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties
          echo "keystore 已恢复："
          ls -l android/keystore/release.keystore

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK is signed (not debug)
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: |
          ver="$(python3 -c "import re;print(re.search(r'version:\s*([0-9.]+)', open('pubspec.yaml').read()).group(1))")"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/PKWDWPL_Lite_${ver}.apk"

      - name: Clean up keystore & signing config
        if: always()
        run: rm -f android/keystore/release.keystore android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkwdwpl-lite-release-apk
          path: build/app/outputs/flutter-apk/PKWDWPL_Lite_*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PKWDWPL Lite ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/PKWDWPL_Lite_*.apk
          body: |
            ## PKWDWPL Lite ${{ github.ref_name }}

            蓝牙串口（Classic Bluetooth SPP）APRS 接收 App。

            - 作者 / 开发者：BG7LZQ
            - 技术接口协议提供者：BH7NOR
            - 数据协议：Kenwood `$PKWDWPL` NMEA 0183
            - 支持 Android（API 23+）

            安装包已用 release key 签名（CI 中已通过 apksigner 验证）。
